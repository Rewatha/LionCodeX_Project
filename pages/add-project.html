<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project - SealTech Engineering</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin-dashboard.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 900px;
            margin: 100px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: #dc3545;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">
            <img src="../images/logo.png" alt="Company Logo">
            SealTech Engineering
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="admin-dashboard.html">Admin Panel</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
        <div class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="form-container">
        <div class="form-header">
            <h1><i class="fas fa-plus-circle"></i> Add New Project</h1>
            <p>Create a new waterproofing project</p>
        </div>

        <!-- Alert Messages -->
        <div id="alert-success" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Project created successfully!
        </div>
        <div id="alert-error" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span id="error-message"></span>
        </div>

        <!-- Add Project Form -->
        <form id="addProjectForm">
            <div class="form-grid">
                <!-- Project Name -->
                <div class="form-group full-width">
                    <label for="projectName">Project Name <span class="required">*</span></label>
                    <input type="text" id="projectName" name="projectName" required
                        placeholder="e.g., Villa Roof Waterproofing">
                </div>

                <!-- Customer Selection -->
                <div class="form-group">
                    <label for="customerId">Customer <span class="required">*</span></label>
                    <select id="customerId" name="customerId" required>
                        <option value="">Select Customer...</option>
                        <!-- Will be populated dynamically -->
                    </select>
                </div>

                <!-- Project Type -->
                <div class="form-group">
                    <label for="projectType">Project Type <span class="required">*</span></label>
                    <select id="projectType" name="projectType" required>
                        <option value="">Select Type...</option>
                        <option value="Roof Waterproofing">Roof Waterproofing</option>
                        <option value="Wall Waterproofing">Wall Waterproofing</option>
                        <option value="Foundation Waterproofing">Foundation Waterproofing</option>
                        <option value="Bathroom Waterproofing">Bathroom Waterproofing</option>
                        <option value="Basement Waterproofing">Basement Waterproofing</option>
                        <option value="Swimming Pool">Swimming Pool</option>
                        <option value="Terrace/Balcony">Terrace/Balcony</option>
                        <option value="Commercial Building">Commercial Building</option>
                        <option value="Emergency Repair">Emergency Repair</option>
                    </select>
                </div>

                <!-- Location -->
                <div class="form-group">
                    <label for="location">Location <span class="required">*</span></label>
                    <input type="text" id="location" name="location" required placeholder="e.g., Colombo">
                </div>

                <!-- Team Assignment -->
                <div class="form-group">
                    <label for="teamId">Assign Team</label>
                    <select id="teamId" name="teamId">
                        <option value="">No Team Assigned</option>
                        <!-- Will be populated dynamically -->
                    </select>
                </div>

                <!-- Start Date -->
                <div class="form-group">
                    <label for="startDate">Start Date <span class="required">*</span></label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>

                <!-- Estimated Completion -->
                <div class="form-group">
                    <label for="estimatedCompletion">Estimated Completion</label>
                    <input type="date" id="estimatedCompletion" name="estimatedCompletion">
                </div>

                <!-- Estimated Cost -->
                <div class="form-group">
                    <label for="estimatedCost">Estimated Cost (LKR)</label>
                    <input type="number" id="estimatedCost" name="estimatedCost" placeholder="0.00" step="0.01">
                </div>

                <!-- Status -->
                <div class="form-group">
                    <label for="status">Status <span class="required">*</span></label>
                    <select id="status" name="status" required>
                        <option value="planning">Planning</option>
                        <option value="scheduled" selected>Scheduled</option>
                        <option value="in_progress">In Progress</option>
                        <option value="on_hold">On Hold</option>
                    </select>
                </div>

                <!-- Description -->
                <div class="form-group full-width">
                    <label for="description">Project Description</label>
                    <textarea id="description" name="description"
                        placeholder="Enter project details, requirements, and notes..."></textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-dashboard.html'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Create Project
                </button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>SealTech Engineering</h3>
                <p>Your trusted partner for professional waterproofing solutions.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 SealTech Engineering. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/session-manager.js"></script>
    <script src="../js/add-project.js"></script>
</body>

</html>
